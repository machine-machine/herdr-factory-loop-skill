name: Release

# Prebuilt-rot guard: every v* tag first PROVES the committed prebuilt/ set
# reproduces byte-for-byte (make prebuilt-check — possible because the Makefile
# builds with -trimpath -buildvcs=false), then rebuilds all four m2herd-tui
# targets and attaches them to the release, so the attached binaries are provably
# the committed ones and users can always download current binaries.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: release (build all prebuilts + attach)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: tui/go.sum

      # Cross-check BEFORE rebuilding: `tui-release` overwrites prebuilt/, so a
      # check afterwards would only compare the build against itself. This is the
      # step that makes the attached binaries provably the committed ones.
      - name: prebuilt-check (committed prebuilt/ matches this tag)
        run: make prebuilt-check

      - name: build all release targets
        run: make tui-release

      - name: checksums
        run: |
          cd prebuilt
          sha256sum m2herd-tui-* | tee SHA256SUMS

      - name: attach binaries to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            prebuilt/m2herd-tui-*
            prebuilt/SHA256SUMS
          generate_release_notes: true
